# IceBoatRacing, a powerful plugin for your ice boat racing server.
# - Developed by mattmunich
#
# ----------------------------------------------------------------
# Welcome to the main configuration file of this plugin.
# Below, you can change the main settings for this plugin,
# like the language, the number of laps required to finish
# a race and more.
# ----------------------------------------------------------------
# Some instructions:
# - The default value for race.lights.x/y/z is 123456789,
#   if they are read by the plugin, the race lights are
#   automatically disabled.
# ----------------------------------------------------------------

# Will read from the file [language].yml, so by default: en_US.yml
language: en_US

# Configure the race.
race:
  # Whether a player should be allowed to continue racing even after logging out and back in
  allowRejoin: true

  # Whether to put a player back where they joined the race from
  ## once they leave or finish it. This is not stored on disk, so after a
  ## server restart the world spawn is used instead.
  teleportBackAfterRace: true

  # Race registration intermission.
  ## /race prepare broadcasts a clickable Join button, and only the players
  ## who click it take part. Nobody is teleported or gamemode-switched until
  ## the race actually starts.
  intermission:
    # How long registration stays open, in seconds
    seconds: 120
    # Start the race automatically when the intermission ends
    ## If false, an admin has to run /race start manually.
    autoStart: true
    # Minimum number of joined players needed to start
    minRacers: 1
    # Times remaining (seconds) at which the join button is repeated in chat
    reminderSeconds: [60, 30, 10]

  # Whether a player's car should be removed when they log out
  ## If allowRejoin is false, the car will always be removed
  removeCarWhenLoggingOut: false

  # Configure the race lights
  # -> colored glass that will change on
  #    race start to simulate race lights
  lights:
    enabled: false
    from:
      x: 123456789
      y: 123456789
      z: 123456789
    to:
      x: 123456789
      y: 123456789
      z: 123456789