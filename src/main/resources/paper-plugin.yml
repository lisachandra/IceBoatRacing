name: IceBoatRacing
version: '${version}'
main: fr.mattmunich.iceBoatRacing.Main
api-version: '1.21'
author:  mattmunich
website: https://modrinth.com/plugin/ibr
description: A plugin for Minecraft ice boat racing
load: POSTWORLD
prefix: "IceBoatRacing"
provides:
  - iceboatracing
  - ibr
dependencies:
  server:
    packetevents:
      required: false
      load: AFTER
      join-classpath: true

permissions:
  iceboatracing.*:
    default: op
    description: All the permissions of the plugin
    children:
      iceboatracing.command.*: true
  iceboatracing.command.*:
    default: op
    description: The permission for all commands
    children:
      iceboatracing.command.checkpoint: true
      iceboatracing.command.car: true
      iceboatracing.command.race: true
      iceboatracing.command.race.join: true
      iceboatracing.command.plugin: true
  iceboatracing.command.race:
    description: The permission for the /race command
    default: op
  iceboatracing.command.race.join:
    description: Allows joining and leaving a race with /race join and /race leave
    default: true
  iceboatracing.command.car:
    description: The permission for the /car command
    default: op
  iceboatracing.command.checkpoint:
    description: The permission for the /checkpoint command
    default: op
  iceboatracing.command.plugin:
    description: The permission for the /iceboatracing or /ibr command
    default: op

