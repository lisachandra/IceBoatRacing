# IceBoatRacing, a powerful plugin for your ice boat racing server.
# - Developed by mattmunich
#
# ----------------------------------------------------------------
# Welcome to the en_US message configuration file.
# Below, you can change the messages that will be shown by
# the plugin when the language in config.yml is set to
# this file's name (without the .yml)
# ----------------------------------------------------------------
# Some instructions:
# - Color codes
# You can use the § sign followed by a specific character to
# add color to these messages.
#
# - Arguments/Variables
# Some messages support arguments that will be formatted like:
# %argument%. These will are hard-coded in the plugin and will
# be replaced independently of this config. If they are
# missing, they just won't show up in the message.
# ----------------------------------------------------------------


#The prefix used in the beginning of every message
#(except titles and messages under the "noPrefix" section)
prefix: "<b><gradient:#8DABF3:#10CA9A>IBR</gradient><dark_gray> >></b><reset>"

liveScore:
  #The title of the scoreboard during a race
  title: "§3-- §b§lIce Boat Race §3--"
  format: "§b%player% §7- §3Laps: §b%completedLapCount%§3/§b%lapCount% §7- §3Pits: §b%completedPitStops%§3/§b%requiredPitStops%"

noPrefix:
  #Join and leave messages
  join: "§7[§a+§7] §b%player%"
  quit: "§7[§c-§7] §b%player%"

#Messages regarding the  setting pos
pos:
  1: "§bPos §31§b : §3%x%§b, §3%y%§b, §3%z%§b"
  2: "§bPos §32§b : §3%x%§b, §3%y%§b, §3%z%§b"
  notSet: "§cSelect §4both positions§c first!\n§8ℹ With a wooden shovel"

checkpoint:
  #Usage / success messages
  create:
    usage: "§cUsage: /checkpoint create [sector|finish] <raceName> [id]"
  override:
    usage: "§cUsage: /checkpoint override [sector|finish] <raceName> <id>"
  startLineSaved: "§aStart line saved!\n§8ℹ Run /checkpoint create finish <raceName> if your finish line differs from the start line"
  finishLineSaved: "§aFinish line saved!"
  saved: "§aCheckpoint §2%id%§a saved"
  inserted: "§aCheckpoint §2%id%§a inserted, the following checkpoints were shifted up"
  overridden: "§aCheckpoint §2%id%§a was replaced"
  renumbered: "§aRenumbered §2%count%§a checkpoints of race §3%race%§a into a contiguous range"
  renumber:
    usage: "§cUsage: /checkpoint renumber <raceName>"
  shape:
    usage: "§cUsage: /checkpoint shape <raceName> <checkpointID> <plane|box>"
    already: "§cCheckpoint §4%id%§c is already a §4%shape%§c checkpoint."
    converted: "§aCheckpoint §2%id%§a converted to a §2%shape%§a checkpoint"
  type:
    usage: "§cUsage: /checkpoint type <raceName> <checkpointID> <normal|sector|finish>"
    already: "§cCheckpoint §4%id%§c is already type §4%type%§c."
    converted: "§aCheckpoint §2%id%§a is now type §2%type%§a §7(sector ID: §f%sectorID%§7)"
  sectorSaved: "§aSector §e%sectorID% §asaved!"
  idOutOfRange: "§cID must be between §4%min%§c and §4%max%§c."
  startFinishRequired: "§cCheckpoint §41§c must be the start/finish line.\n§8ℹ Use §f/checkpoint create finish <raceName> 1 §8or pick another ID."
  finishAlreadyExists: "§cRace §4%race%§c already has a start/finish line. A lap is only completed by crossing that one gate, so there can't be a second."
  raceBusy: "§cCan't change checkpoint IDs for race §4%race%§c while it is preparing, starting or running."
  removed: "§aCheckpoint §6%id%§a removed"
  count: "§aThere are %count% checkpoints"
  resetPlayerScore: "§a%player%'s§a score has been reset"
  nearestCheckpointID: "§bThe nearest checkpoint in race §3%race%§b has ID §3%id%"

  #Errors
  noCheckpointFound: "§cNo checkpoint found nearby!\n§8ℹ You can also run /checkpoint list"
  invalid: "§cInvalid checkpoint number"
  noCheckpoint: "§cNo checkpoint defined"

  #Main /checkpoint help
  help: "§3--------- §b§l/checkpoint§r §3---------
  \n§3->§a list [page] §8-§7 List all checkpoints
  \n§3->§a count §8-§7 Show the checkpoint count
  \n§3->§a create [sector|finish] <raceName> [id] §8-§7 Create a checkpoint
  \n§3->§a override [sector|finish] <raceName> <id> §8-§7 Replace a checkpoint
  \n§3->§a autotrace start|stop|preview|configure|confirm|sector|add|resize|delete|accept|cancel §8-§7 Auto-trace the track
  \n§3->§a addAlternate <raceName> <checkpointID> §8-§7 Add an alternate route
  \n§3->§a shape <raceName> <checkpointID> <plane|box> §8-§7 Convert a checkpoint's shape
  \n§3->§a type <raceName> <checkpointID> <normal|sector|finish> §8-§7 Convert a checkpoint's type
  \n§3->§a renumber <raceName> §8-§7 Close gaps in the checkpoint order
  \n§3->§a view <raceName> §8-§7 Toggle checkpoint visibility
  \n§3->§a remove|delete <raceName> <checkpointID> §8-§7 Remove a checkpoint §7(no args = nearest)
  \n§3->§a clearAll <raceName> §8-§7 Remove all checkpoints
  \n§3->§a resetData <raceName> <player> §8-§7 Reset a player's score
  \n§3->§a getID <raceName> §8-§7 Show the nearest checkpoint's ID
  "


  #Tags shown in /checkpoint list
  list:
    planeTag: " §7[plane]"
    altTag: " §7[+%count% alt]"

  #/checkpoint view
  view:
    "on": "§bCheckpoint visibility for race §3%race%§b: §aenabled"
    "off": "§bCheckpoint visibility for race §3%race%§b: §cdisabled"
    switched: "§bCheckpoint visibility for race §3%race%§b: §aenabled §7(switched from the previous race)"

  #Auto-trace (recording/generation) commands
  autotrace:
    help: "§3--------- §b§l/checkpoint autotrace§r §3---------
    \n§3->§a start <raceName> [--create] §8-§7 Start recording
    \n§3->§a stop §8-§7 Stop recording
    \n§3->§a preview §8-§7 Toggle the preview
    \n§3->§a configure <width|height|spacing|loop> <value> §8-§7 Edit the settings
    \n§3->§a confirm §8-§7 Confirm the auto-trace settings
    \n§3->§a sector §8-§7 Mark a sector
    \n§7§oℹ Click 2 blocks with the shovel first
    \n§3->§a add §8-§7 Add a manual checkpoint
    \n§7§oℹ Click 2 blocks to add it
    \n§3->§a resize §8-§7 Resize a checkpoint
    \n§7§oℹ Click 2 blocks marking the correct width
    \n§3->§a delete §8-§7 Remove a checkpoint
    \n§7§oℹ Stand near the checkpoint to remove
    \n§3->§a accept §8-§7 Save the generated checkpoints
    \n§3->§a cancel [--noRestart] §8-§7 Cancel the session
    "

    usageStart: "§cUsage: /checkpoint autotrace start <raceName> [--create]"
    usageConfigure: "§cUsage: /checkpoint autotrace configure <width|height|spacing|loop> <value>"
    started: "§aRecording started for race §f%race%§a. Ride or walk the full lap of the track.\n§8ℹ Recording stops automatically once you return near the starting point, or run §f/checkpoint autotrace stop §8manually."
    noSession: "§cYou don't have an active auto-trace session."
    notEnoughPoints: "§cNot enough points recorded to generate checkpoints. Try again."
    stopped: "§aRecording stopped. §f%count% §acheckpoints generated.\n§8ℹ Run §f/checkpoint autotrace sector §8to mark sectors, /checkpoint autotrace resize/delete to edit checkpoints, or §f/checkpoint autotrace accept §8to save."
    loopClosed: "§aLoop closed — recording stopped automatically. §f%count% §acheckpoints generated."
    noPreview: "§cNo generated checkpoints to preview.\n§8ℹ Run start then stop first."
    previewOn: "§aPreview enabled §7— run the command again to disable it."
    previewOff: "§7Preview disabled."
    noPreviewForSector: "§cNo active preview to add a sector to.\n§8ℹ Run start then stop first."
    sectorMarked: "§aSector marked.\n§8ℹ Run §f/checkpoint autotrace preview §8to view it, or mark more sectors."
    sectorFailed: "§cCouldn't place the sector here.\n§8ℹ Try clicking closer to the recorded track."
    resizeFailed: "§cNo checkpoint found near those clicks.\n§8ℹ Try clicking closer to the one you want to resize."
    resized: "§aCheckpoint §f#%position% §a(§f%type%§a) resized based on your clicks §7(%distance% blocks away)."
    addFailed: "§cInvalid auto-trace session, couldn't add a checkpoint."
    added: "§aCheckpoint added!"
    deleteFailed: "§cNo checkpoint found near you to remove."
    deleted: "§7Checkpoint §f#%position% §7(§f%type%§7) removed from the preview §7(%distance% blocks away)."
    acceptFailed: "§cNothing to save.\n§8ℹ Generate a preview first (start, then stop)."
    accepted: "§aAuto-traced checkpoints saved!"
    cancelled: "§7Auto-trace session cancelled."
    #Auto-trace settings panel (shown by /checkpoint autotrace start, edited via configure)
    config:
      panel:
        header: "§b§lAuto-trace settings §7— §3%race%"
        spacing: "§7Spacing: §f%value% blocks"
        width: "§7Width: §f%value% blocks"
        height: "§7Height: §f%value% blocks"
        loopOn: "§7Loop: §aenabled"
        loopOff: "§7Loop: §cdisabled"
        edit: "§b[Edit]"
        toggle: "§b[Toggle]"
        start: "§a§l[Start recording]"
      defined: "§aSetting §f%param% §aset to §f%value%§a."
      error:
        noneDefined: "§cNo configuration in progress.\n§8ℹ Run §f/checkpoint autotrace start <raceName> §8first."
        invalidNumerical: "§cInvalid numerical value."
        invalidParam: "§cInvalid parameter. Use §fspacing§c, §fwidth§c, §fheight §cor §floop§c."

  #Alternate route (bypass gate) command
  addAlternate:
    added: "§aAlternate route added for checkpoint §f#%id%§a."

  #Bulk checkpoint clearing
  clearAll:
    warning: "§c⚠ This will permanently delete the §f%count% §ccheckpoint(s) of race §f%race%§c."
    confirmHint: "§cRun §f/checkpoint clearAll %race% §cagain within 10 seconds to confirm."
    cleared: "§aAll checkpoints for race §f%race% §ahave been removed."

race:
  #Will be displayed to every player
  start: "§aRace %race% starting..." #Displayed when '/race start <name>' is used
  notFound: "§cRace not found." #Displayed when the inputted race is invalid
  end: "§cThe race has ended!" #Displayed when '/race end' is used

  #Only displayed to the command executor
  prepare: "§aPlayers will be placed automatically." #Displayed when '/race prepare' is used (and prepare toggled OFF)
  cancelPrepare: "§aPreparation mode disabled." #Displayed when '/race prepare' is used (and prepare toggled ON)
  deleted: "§aRace %race% has been deleted."#Displayed when '/race delete' is used and is successful

  #Registration intermission: players opt in instead of everyone being teleported
  intermission:
    announce: "§b§l🏁 Race %race% §r§7— §f%laps% laps\n§7Registration closes in §f%seconds%s§7. Click below to take part.\n§8§oℹ Effects and your gamemode are untouched.\n%join%"
    joinButton: "§a§l[ Join race ]"
    joinButtonHover: "§7Click to join. Requires a registered car."
    countdown: "§b%race%§7 — §f%seconds%s§7 left to join §8(%count% joined)"
    opened: "§aRegistration open for race §f%race%§a for §f%seconds%s§a."
    cancelled: "§7Registration for race §f%race%§7 closed. Nobody was moved."
    closed: "§7Registration for race §f%race%§7 closed."
    closedAwaitingStart: "§7Registration for race §f%race%§7 closed. §f%count%§7 racer(s) registered — an admin can start it now."
    cannotStartEmpty: "§cRace §4%race%§c can't start: nobody joined it.\n§8ℹ Run §f/race prepare %race%§8 to open registration."
    closedNoRacers: "§cRace §4%race%§c didn't start: only §4%min%§c racer(s) required but nobody joined."
    alreadyRunning: "§cRace §4%race%§c is already starting or running."
    notOpen: "§cRegistration for race §4%race%§c is not open right now."
    joined: "§aYou joined §f%race%§a! §7(%count% joined)\n§8ℹ You'll be put into your boat when the race starts. Nothing changes until then."
    alreadyJoined: "§eYou already joined race §f%race%§e."
    alreadyInOther: "§cYou are already registered in race §4%race%§c."
    noCar: "§cYou don't have a car registered for race §4%race%§c.\n§8ℹ Ask an admin to run §f/car create§8 to set one up for you."
    left: "§7You left race §f%race%§7."
    notJoined: "§cYou are not registered in race §4%race%§c."
    notJoinedAny: "§cYou are not registered in any race."
    noneOpen: "§cNo race has registration open right now."
    specifyRace: "§cSeveral races match, please specify one: §f/race join <raceName>"
    rejoined: "§aWelcome back! You are still registered for race §f%race%§a.§7\n§8ℹ You'll be placed in your boat when it starts."

  #Lap count
  currentLapCount: "§bThe lap count for race %race% is set to §3%lapCount%§b. \n§8ℹ Use /race setLapCount <name> <number>"
  updatedLapCount: "§bThe lap count for race §3%race%§b has been set to §3%lapCount%§b."
  invalidLapCount: "§cThe lap count entered is invalid."

  #Start rotation
  currentStartRotation: "§bThe starting angle for the race %race% is set to §3%startRotation%°§b."
  updatedStartRotation: "§bThe starting angle for the race §3%race%§b has been set to §3%startRotation%°§b."
  invalidStartRotation: "§cThe entered starting angle is invalid. §8Use: §70§8-§7360§8 or §7north§8/§7west§8/§7south§8/§7east"

  #Pit stops
  currentPitStops: "§bThe number of mandatory pit stops for race %race% is set to §3%pitStops%§b."
  updatedPitStops: "§bThe number of mandatory pit stops for race §3%race%§b has been set to §3%pitStops%§b."
  invalidPitStops: "§cThe pit stop count entered is invalid."

  #Lights
  currentLights: "§bThe starting lights for race %race% are set from §3%x1%§b, §3%y1%§b, §3%z1%§b to §3%x2%§b, §3%y2%§b, §3%z2%§b."
  lightsNotSet: "§cThe starting lights have not been set yet."
  lightsDisabled: "§cThe starting lights are disabled. §8ℹ Re-enable them in this race's configuration file."
  updatedLights: "§bThe starting lights for race §3%race%§b have been set from §3%x1%§b, §3%y1%§b, §3%z1%§b to §3%x2%§b, §3%y2%§b, §3%z2%§b."

  #Help message
  help: "§3--------- §b§l/race§r §3---------
  \n§3->§a create §8-§7 Create a race (interactive)
  \n§3->§a info <race> §8-§7 Show the race's configuration
  \n§3->§a prepare <race> [seconds] §8-§7 Open/close race registration
  \n§7§oℹ Announces a clickable Join button in chat
  \n§3->§a join <race> §8-§7 Join an open race
  \n§3->§a leave <race> §8-§7 Leave the race you joined
  \n§3->§a start <race> §8-§7 Start the race
  \n§3->§a end <race> §8-§7 End the race
  \n§3->§a remove|delete <race> §8-§7 Delete the race
  \n§3->§a setLapCount <race> [number] §8-§7 Set the lap count §7(no number = show current)
  \n§3->§a setStartRotation <race> [degrees|n/e/s/w] §8-§7 Set the starting angle
  \n§3->§a setPitStops <race> [number] §8-§7 Set the number of required pit stops
  \n§3->§a setLights <race> §8-§7 Set the starting lights §7(with the shovel)
  "

  #/race info overview
  infoHeader: "§3--------- §b§l%race%§r §3---------"
  infoCars: "§bRegistered cars: §3%count%"
  infoPitBoxes: "§bPit boxes: §3%count%"

  #In race events
  onCompleteLap:
    title: "§6%currentLapCount%/%raceLapCount%"
    subtitle: "§alaps completed"
    message: "§3%player%§b §8§l>>§r§b lap #§3%ID%§b completed in §3%time%§b"
    messageBestLapTimeYet: "§3%player% §8§l>>§b lap §3%ID%§b completed in §3%time%§b §7-§f new record time!"
  onCrossSector: "§r§3%player%§b §8§l>>§r§b sector §3%ID%§b: §3%time%§b"
  onFinish:
    message: "§2%player%§b finished the race in §2%time%§a and is ranked §2#%ranking%§a!"
    title: "§2Race finished!"
    subtitle: "§aYou are #%ranking%"
    disqualifiedNotice: "§c%player% §cdid not complete the required number of pit stops (§4%completed%§c/§4%required%§c) and will be disqualified!"
    statsMessage: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬▬ §x§5§5§D§D§F§F§lRace Results §x§0§0§A§D§F§F§l▬▬▬▬▬▬§r\n
    §bRanking: §3#%ranking%§b/%players%\n
    §bTotal time: §x§4§0§C§4§F§F%raceTime%\n
    §bAverage lap: §3%meanLapTime%\n
    §bBest lap: §a%bestLapTime%\n
    §bSlowest lap: §c%worstLapTime%\n
    §bBest sector times:\n
    %bestSectorsTimes%
    \n
    §bGap to winner: §c%gapToWinner%\n
    §bGap to next player: §x§F§F§D§7§0§0%gapToNext%\n
    §x§0§0§A§D§F§F§l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n
    "
    statsMessageWinner: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬▬ §x§5§5§D§D§F§F§lRace Results §x§0§0§A§D§F§F§l▬▬▬▬▬▬§r\n
    §bRanking: §3§l#%ranking%§b/%players%\n
    §bTotal time: §x§4§0§C§4§F§F%raceTime%\n
    §bAverage lap: §3%meanLapTime%\n
    §bBest lap: §a%bestLapTime%\n
    §bSlowest lap: §c%worstLapTime%\n
    §bBest sector times:\n
    %bestSectorsTimes%
    §x§0§0§A§D§F§F§l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n
    "
    sectorFormat: "§b- Sector §3#%sectorID% §8» §a%time%\n"
  onEnd:
    top: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬▬ §x§5§5§D§D§F§F§lFinal Standings §x§0§0§A§D§F§F§l▬▬▬▬▬▬§r\n"
    winnerFormat: "§3#%ranking% §b%player% §8» §x§4§0§C§4§F§F%raceTime%§b\n"
    playerFormat: "§r§3#%ranking% §b%player% §8» §x§4§0§C§4§F§F%raceTime%§b (gap: §x§4§0§C§4§F§F%gapToNext%§b)\n"
    disqualifiedFormat: "§4DSQ §8» §c%player% §8(§c%raceTime%§8) §7— incomplete pit stops\n"
    highlights: "\n§r§b🏆 Best lap: §a%bestLapPlayer% §8(§a%bestLapTime%§8)\n
    §b🐢 Slowest lap: §c%worstLapPlayer% §8(§c%worstLapTime%§8)\n
    §b⚡ Win gap: §3%winnerGap%\n"
    bestSectorTimesTop: "\n§x§0§0§A§D§F§F§l▬▬▬▬▬ §x§5§5§D§D§F§F§lBest Sectors §x§0§0§A§D§F§F§l▬▬▬▬▬§r\n"
    sectorFormat: "§r§bSector §3#%sectorID% §8» §a%player% §8(§e%time%§8)\n"
    bottom: "§x§0§0§A§D§F§F§l▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬\n"
    error:
      noRacers: "§4Couldn't send the race ranking:§c no players found."
      noRanking: "§4Couldn't send the race ranking:§c no ranking available."

  select: "§bSelect a race:"
  create:
    start: "yes"
    later: "no"
    confirm: "confirm" #Confirm race deletion
    cancel: "cancel" #The message to send to cancel the race creation process
    confirmCancel: "§eAre you sure you want to cancel the race creation?\nUse §c%confirm%§e to confirm and §a%cancel%§e to cancel the deletion."
    cancelled: "§bRace creation has been cancelled." #When you cancel the creation
    #Naming the race
    1:
      title: "§3Race name"
      subtitle: "§bEnter the §3name§b in chat"
      message: "§bStart by entering the race name below (in chat)."
      completed: "§bThe race name has been set to §3%name%"
      alreadyExists: "§cA race with the same name already exists, please choose another name."
    2:
      title: "§3Lap count"
      subtitle: "§bEnter the §3number§b in chat"
      message: "§bEnter the number of §3laps§b to §3complete§b to §3finish§b the race (in chat)."
      completed: "§bThe race's §3lap count§b has been set to §3%lapCount%"

    #Define the track?
    3:
      title: "§3Track?"
      subtitle: "§bDefine the track?"
      message: "§bDo you want to define the race track? 
      \n-> Enter §3%start%§b to start or §3%later%§b to configure this later.
      \n§8§oℹ This will be used to update participants' live scores. You can always do this later!"

    #Track definition process
    4:
      title: "§3Track definition"
      subtitle: "§bStand at the start"
      message: "§bStand on the starting line and adjust the parameters below if needed, then click §3Start recording§b."
      done:
        title: "§2Done"
        subtitle: "§aTrack saved!"
    5:
      title: "§3Cars?"
      subtitle: "§bDefine the cars?"
      message: "§bWould you like to define the participants' cars? \n-> Enter §3%start%§b to start or §3%later%§b to configure this later.\n§8§oℹ These will be automatically placed when the race starts, and their passengers teleported into them. You can always do this later!"
    6:
      title: "§3Car creation"
      subtitle: "§bCreation is about to begin..."
      message: "§bThe car creation process is about to begin...\n§8§oℹSend %done% to save when you're finished."
      carCreation:
        done: "save"
      feedback:
        endInstructions:
          actionBar: "§aSend %done% to finish creation"
        done:
          title: "§2Done"
          subtitle: "§aCars saved!"

    done:
      title: "§3Race saved!"
      subtitle: "§bThe race was created successfully"
      message: "§aThe race has been saved successfully!\n§b-> §3/checkpoint autotrace§b to define/edit the track\n§b-> §3/car create§b to register cars\n§b-> §3/race info <raceName>§b to view the race's information"

pitbox:
  boxBox: "BOX BOX %player%"
  completed: "§aPit stop complete §7(§f%completed%§7/§f%required%§7)§a, you can go now!"
  countdown:
    title: "§c§l%seconds%"
    subtitle: "§7pit stop in progress..."
