    left: "§cPit stop cancelled — you left the box. §7Drive back in to restart it."
    noChest: "§e⚠ No chest found inside this pit box zone (or on top of it) yet!\n§8ℹ Place one in the marked zone — it's detected as soon as you open it."
    actionBar: "§b%remaining%§7 item(s) left to loot"
  noPitBoxes: "§cNo pit boxes defined for this race."
  invalid: "§cInvalid pit box number"
  removed: "§aPit box §6%name%§a removed"
  setAllowed:
    current: "§bPit box §f%name%§b is allowed for: §3%players%"
    updated: "§aPit box §f%name%§a updated, allowed for: §3%players%"
