  invalidPitStops: "§cLe nombre d'arrêts au stand entré est invalide."

  #Lights
  currentLights: "§bLes feux de départ pour la course %race% sont définis de §3%x1%§b, §3%y1%§b, §3%z1%§b à §3%x2%§b, §3%y2%§b, §3%z2%§b."
  lightsNotSet: "§cLes feux de départ ne sont pas encore définis."
  lightsDisabled: "§cLes feux de départ sont désactivés. §8ℹ Réactivez-les dans le fichier de configuration de cette course."
  updatedLights: "§bLe feux de départ pour la course §3%race%§b ont été définis de §3%x1%§b, §3%y1%§b, §3%z1%§b à §3%x2%§b, §3%y2%§b, §3%z2%§b."

  #Help message
  help: "§3--------- §b§l/race§r §3---------
  \n§3->§a create §8-§7 Créer une course (interactif)
  \n§3->§a info <course> §8-§7 Afficher la configuration de la course
  \n§3->§a prepare <course> [secondes] §8-§7 Ouvrir/fermer les inscriptions
  \n§7§oℹ Annonce un bouton « Rejoindre » cliquable dans le chat
  \n§3->§a join <course> §8-§7 Rejoindre une course ouverte
  \n§3->§a leave <course> §8-§7 Quitter la course rejointe
  \n§3->§a start <course> §8-§7 Lancer la course
  \n§3->§a end <course> §8-§7 Finir la course
  \n§3->§a remove|delete <course> §8-§7 Supprimer la course
  \n§3->§a setLapCount <course> [nombre] §8-§7 Définir le nombre de tours §7(sans valeur = afficher)
  \n§3->§a setStartRotation <course> [degrés|n/e/s/w] §8-§7 Définir l'angle de départ
  \n§3->§a setPitStops <course> [nombre] §8-§7 Définir le nombre de d'arrêts aux stands requis
  \n§3->§a setLights <course> §8-§7 Définir les feux de départ §7(avec la pelle)
  "

  #Aperçu /race info
  infoHeader: "§3--------- §b§l%race%§r §3---------"
  infoCars: "§bVoitures enregistrées : §3%count%"
  infoPitBoxes: "§bStands : §3%count%"

