    alreadyRunning: "§cLa course §4%race%§c est déjà en train de démarrer ou en cours."
    notOpen: "§cLes inscriptions pour la course §4%race%§c ne sont pas ouvertes."
    joined: "§aTu as rejoint §f%race%§a ! §7(%count% inscrits)\n§8ℹ Tu seras placé dans ton bateau au départ. Rien ne change d'ici là."
    alreadyJoined: "§eTu as déjà rejoint la course §f%race%§e."
    alreadyInOther: "§cTu es déjà inscrit à la course §4%race%§c."
    noCar: "§cTu n'as pas de voiture enregistrée pour la course §4%race%§c.\n§8ℹ Demande à un admin d'utiliser §f/car create§8 pour t'en créer une."
    left: "§7Tu as quitté la course §f%race%§7."
    notJoined: "§cTu n'es pas inscrit à la course §4%race%§c."
