    joinButton: "§a§l[ Rejoindre ]"
    joinButtonHover: "§7Clique pour rejoindre. Une voiture enregistrée est requise."
    countdown: "§b%race%§7 — §f%seconds%s§7 pour rejoindre §8(%count% inscrits)"
    opened: "§aInscriptions ouvertes pour la course §f%race%§a pendant §f%seconds%s§a."
    cancelled: "§7Inscriptions pour la course §f%race%§7 fermées. Personne n'a été déplacé."
    closed: "§7Inscriptions pour la course §f%race%§7 fermées."
